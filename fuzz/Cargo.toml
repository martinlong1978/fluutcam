[package]
name = "fluut-fuzz"
description = "cargo-fuzz targets for the STEP, DXF, SVG and STL readers (design D04 §10, D05); not a workspace member"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fluut-io-step = { path = "../crates/fluut-io-step" }
fluut-io-2d = { path = "../crates/fluut-io-2d" }
fluut-io-mesh = { path = "../crates/fluut-io-mesh" }

# Not a member of the FluutCAM workspace.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "map"
path = "fuzz_targets/map.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dxf"
path = "fuzz_targets/dxf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg"
path = "fuzz_targets/svg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stl"
path = "fuzz_targets/stl.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[[bin]]
name = "parse_parallel"
path = "fuzz_targets/parse_parallel.rs"
test = false
doc = false
bench = false
