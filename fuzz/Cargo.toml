[package]
name = "fluut-fuzz"
description = "cargo-fuzz targets for the STEP reader (design D04 §10); not a workspace member"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
fluut-io-step = { path = "../crates/fluut-io-step" }

# Not a member of the FluutCAM workspace.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "map"
path = "fuzz_targets/map.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
