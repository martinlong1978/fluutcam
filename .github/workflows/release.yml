# Release workflow (design D14 §5, spec 06 §6.2).
#
# Pushing a tag `vX.Y.Z` builds release binaries for Windows, macOS and Linux,
# packages them, adds an SBOM, checksums and the update manifest, and creates a
# DRAFT GitHub release. A person publishes the draft after looking at it.
#
# Signing (docs/CODE_SIGNING.md):
# - Windows executables: Authenticode through SignPath (SignPath Foundation
#   open-source programme). An approver approves each request in SignPath, so
#   the build job waits for it.
# - macOS: ad hoc only, by decision (no Developer ID, no notarisation).
# - Every release file: a GitHub build provenance attestation.
# - releases.json, releases-beta.json and SHA256SUMS: minisign (same key for
#   every channel).
#
# SignPath and minisign are optional. Each step is guarded on its secrets
# being set; without them the workflow still makes unsigned packages. The
# `secrets` context cannot be used in a step `if`, so the `check` job reports
# which secrets exist as outputs (`sign_*`), and the signing steps test those.
# Each secret is given only to the step that uses it, never to a step that
# builds code. The secrets and variables to set are listed in D14 §5.2.
#
# The Windows installer (MSI) is built from the SIGNED executables in its own
# job, then submitted to SignPath a second time (its own artifact
# configuration), so the executables inside it and the MSI itself are signed.
# The Linux AppImage is built from the tarball with a pinned appimagetool, and
# the Flatpak bundle from the same tarball with flatpak-builder (unsigned).

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Dry run: the same jobs from any branch, to test the workflow before a tag.
  # Nothing is signed, attested or released; the packages are uploaded as the
  # `dry-run-dist` workflow artifact instead.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag must name the workspace version, so a package never carries a
  # different version than its tag.
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      epoch: ${{ steps.v.outputs.epoch }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sign_windows: ${{ steps.secrets.outputs.windows }}
      sign_windows_msi: ${{ steps.secrets.outputs.windows_msi }}
      sign_minisign: ${{ steps.secrets.outputs.minisign }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - id: v
        run: |
          version=$(cargo xtask version)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # SOURCE_DATE_EPOCH: the commit time (D14 §5.4).
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - id: secrets
        name: Which signing secrets are set?
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          # A dry run never sends anything to SignPath and never signs.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            for f in windows windows_msi minisign; do echo "$f=false"; done | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          all_set() { for v in "$@"; do [ -n "${!v}" ] || return 1; done; }
          flag() { if all_set "${@:2}"; then echo "$1=true"; else echo "$1=false"; fi; }
          {
            flag windows SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG
            flag windows_msi SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG
            flag minisign MINISIGN_SECRET_KEY MINISIGN_PUBLIC_KEY
          } | tee -a "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
      # Fixed seed for compile-time random constants (ahash), so builds repeat.
      CONST_RANDOM_SEED: fluutcam-release
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - name: Release flags (path remapping, control-flow guard)
        shell: bash
        run: echo "RUSTFLAGS=$(cargo xtask rustflags)" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p fluut-cli -p fluut-app
      - name: Collect binaries
        shell: bash
        run: |
          mkdir bin
          for b in fluut fluutcam; do
            cp "target/${{ matrix.target }}/release/$b${{ matrix.ext }}" bin/
          done

      # SignPath signs only files whose version resource names the product and
      # the release version (docs/CODE_SIGNING.md), so check that first.
      - name: Check version resources
        if: ${{ matrix.name == 'windows-x86_64' }}
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          foreach ($exe in "bin\fluut.exe", "bin\fluutcam.exe") {
            $v = (Get-Item $exe).VersionInfo
            "${exe}: $($v.ProductName) $($v.ProductVersion)"
            if ($v.ProductName -ne "FluutCAM" -or $v.ProductVersion -ne $env:VERSION) {
              throw "$exe has product '$($v.ProductName)' version '$($v.ProductVersion)', expected FluutCAM $env:VERSION"
            }
          }

      # Authenticode signs PE files, not zips, so the executables are signed
      # here, before they are packed. SignPath takes a GitHub artifact, signs
      # the files its artifact configuration names
      # (packaging/signpath/artifact-configuration.xml) and returns them.
      - name: Upload unsigned executables
        id: unsigned
        if: ${{ matrix.name == 'windows-x86_64' && needs.check.outputs.sign_windows == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.name }}
          path: bin/
          if-no-files-found: error
      - name: Sign executables (SignPath)
        if: ${{ matrix.name == 'windows-x86_64' && needs.check.outputs.sign_windows == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.check.outputs.version) }}
          wait-for-completion: true
          # Each request waits for a person to approve it in SignPath.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed
      - name: Use the signed executables
        if: ${{ matrix.name == 'windows-x86_64' && needs.check.outputs.sign_windows == 'true' }}
        shell: bash
        run: cp signed/fluut.exe signed/fluutcam.exe bin/
      - name: Verify signatures
        if: ${{ matrix.name == 'windows-x86_64' && needs.check.outputs.sign_windows == 'true' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          foreach ($exe in "bin\fluut.exe", "bin\fluutcam.exe") {
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "signature check failed for $exe" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: bin/
          if-no-files-found: error

  # Archives that need no platform tools: the Windows zip and the Linux
  # tarball are written by `cargo xtask package`, with the same bytes for the
  # same input.
  package-portable:
    needs: [check, build]
    runs-on: ubuntu-22.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: in
      - run: cargo xtask icons icons
      - run: |
          cargo xtask package --platform windows-x86_64 --bin-dir in/bin-windows-x86_64 --icons icons --out dist
          cargo xtask package --platform linux-x86_64 --bin-dir in/bin-linux-x86_64 --icons icons --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-portable
          path: dist/
          if-no-files-found: error

  package-macos:
    needs: [check, build]
    runs-on: macos-latest
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-macos-*
          path: in
      - name: Universal binaries
        run: |
          mkdir bin
          for b in fluut fluutcam; do
            lipo -create -output "bin/$b" "in/bin-macos-aarch64/$b" "in/bin-macos-x86_64/$b"
            chmod +x "bin/$b"
            lipo -info "bin/$b"
          done
      - run: cargo xtask icons icons
      - run: cargo xtask package --platform macos-universal --bin-dir bin --icons icons --out dist

      # No Developer ID and no notarisation, by decision (docs/CODE_SIGNING.md).
      # A universal binary made by lipo has lost its signature, and Apple
      # Silicon refuses to run unsigned code, so the app is signed ad hoc.
      - name: Sign the app ad hoc
        run: |
          app=dist/FluutCAM.app
          codesign --force --sign - "$app/Contents/MacOS/fluut"
          codesign --force --sign - "$app/Contents/MacOS/fluutcam"
          codesign --force --sign - "$app"

      - name: Disk image
        run: |
          mkdir dmg
          cp -R dist/FluutCAM.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname FluutCAM -srcfolder dmg -ov -format UDZO \
            "dist/fluutcam-$VERSION-macos-universal.dmg"
          rm -rf dist/FluutCAM.app dmg

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/
          if-no-files-found: error

  # The Windows installer. It holds the signed executables from the build job
  # (bin-windows-x86_64), is signed itself through a second SignPath request,
  # and the files inside are checked afterwards.
  package-msi:
    needs: [check, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/download-artifact@v4
        with:
          name: bin-windows-x86_64
          path: in/bin
      - run: cargo xtask icons icons
      - name: Build the MSI (WiX)
        shell: pwsh
        run: >
          ./packaging/wix/build-msi.ps1 -Version $env:VERSION -BinDir in/bin
          -IconFile icons/windows/fluutcam.ico -Out dist
      - name: Upload unsigned MSI
        id: unsigned
        if: ${{ needs.check.outputs.sign_windows_msi == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msi
          path: dist/*.msi
          if-no-files-found: error
      - name: Sign the MSI (SignPath)
        if: ${{ needs.check.outputs.sign_windows_msi == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(needs.check.outputs.version) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-msi
      - name: Use the signed MSI
        if: ${{ needs.check.outputs.sign_windows_msi == 'true' }}
        shell: pwsh
        run: Copy-Item signed-msi/*.msi dist/ -Force
      - name: Verify signatures (the MSI and the files inside it)
        if: ${{ needs.check.outputs.sign_windows == 'true' || needs.check.outputs.sign_windows_msi == 'true' }}
        shell: pwsh
        env:
          SIGN_MSI: ${{ needs.check.outputs.sign_windows_msi }}
          SIGN_EXE: ${{ needs.check.outputs.sign_windows }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          $msi = (Get-ChildItem dist\*.msi).FullName
          if ($env:SIGN_MSI -eq "true") {
            & $signtool.FullName verify /pa /v $msi
            if ($LASTEXITCODE -ne 0) { throw "signature check failed for the MSI" }
          }
          if ($env:SIGN_EXE -eq "true") {
            # An administrative install unpacks the files without installing.
            $target = Join-Path $env:RUNNER_TEMP "msi-files"
            $p = Start-Process msiexec -Wait -PassThru -NoNewWindow -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$target`""
            if ($p.ExitCode -ne 0) { throw "administrative install failed: $($p.ExitCode)" }
            $exes = @(Get-ChildItem $target -Recurse -Filter *.exe)
            if ($exes.Count -ne 2) { throw "expected 2 executables in the MSI, found $($exes.Count)" }
            foreach ($exe in $exes) {
              & $signtool.FullName verify /pa /v $exe.FullName
              if ($LASTEXITCODE -ne 0) { throw "signature check failed for $($exe.Name) inside the MSI" }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-msi
          path: dist/
          if-no-files-found: error

  # The AppImage is made from the Linux tarball, on the runner of the build
  # (Ubuntu 22.04, glibc 2.35), with appimagetool and its runtime pinned by
  # version and SHA-256 (packaging/appimage/fetch-tools.sh).
  package-appimage:
    needs: [check, package-portable]
    runs-on: ubuntu-22.04
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-portable
          path: in
      - name: Fetch appimagetool (pinned, checksum-verified)
        run: packaging/appimage/fetch-tools.sh "$RUNNER_TEMP/tools"
      - name: Build the AppImage
        run: |
          APPIMAGETOOL="$RUNNER_TEMP/tools/appimagetool" RUNTIME="$RUNNER_TEMP/tools/runtime-x86_64" \
            packaging/appimage/build-appimage.sh "in/fluutcam-$VERSION-linux-x86_64.tar.gz" "$VERSION" work
          mkdir dist
          mv "work/fluutcam-$VERSION-linux-x86_64.AppImage" dist/
      - name: Smoke test
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist/fluutcam-$VERSION-linux-x86_64.AppImage" --appimage-extract >/dev/null
          squashfs-root/usr/bin/fluut --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-appimage
          path: dist/
          if-no-files-found: error

  # The Flatpak is made from the Linux tarball, in the flatpak-builder
  # container, with the freedesktop 24.08 runtime (packaging/flatpak). It packs
  # the prebuilt binaries; Flathub's build from source is a follow-up (plan
  # docs/plan/2026-11-11-flatpak.md). The bundle is a single file, unsigned
  # (the minisign, checksum and attestation steps of `release` cover it).
  package-flatpak:
    needs: [check, package-portable]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    env:
      VERSION: ${{ needs.check.outputs.version }}
      APP_ID: io.github.martinlong1978.FluutCAM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-portable
          path: in
      - name: Validate the launcher and the metainfo
        run: SUDO= packaging/flatpak/validate.sh
      - name: Stage the inputs
        run: packaging/flatpak/build-flatpak.sh "in/fluutcam-$VERSION-linux-x86_64.tar.gz" "$VERSION" work/flatpak
      - name: Build the bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fluutcam.flatpak
          manifest-path: work/flatpak/io.github.martinlong1978.FluutCAM.yml
          branch: stable
          cache: false
          upload-artifact: false
      - name: Smoke test
        run: packaging/flatpak/smoke-test.sh fluutcam.flatpak "$APP_ID"
      - run: |
          mkdir dist
          mv fluutcam.flatpak "dist/fluutcam-$VERSION-linux-x86_64.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-flatpak
          path: dist/
          if-no-files-found: error

  release:
    needs: [check, package-portable, package-macos, package-msi, package-appimage, package-flatpak]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Build provenance attestations (Sigstore keyless).
      id-token: write
      attestations: write
    env:
      SOURCE_DATE_EPOCH: ${{ needs.check.outputs.epoch }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # CycloneDX SBOM of the two shipped programs (D14 §5.3).
      - name: SBOM
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.7
          cargo cyclonedx --format json
          for crate in fluut-app fluut-cli; do
            f=$(find "crates/$crate" -maxdepth 1 \( -name '*.cdx.json' -o -name 'bom.json' \) | head -n 1)
            if [ -z "$f" ]; then
              echo "::error::no SBOM written for $crate"
              exit 1
            fi
            cp "$f" "dist/fluutcam-$VERSION-sbom-$crate.cdx.json"
          done

      # One manifest per channel (D17 §3). `releases.json` lists stable
      # releases only and is read through GitHub's releases/latest, so a
      # pre-release does not make one. `releases-beta.json` lists every release
      # and is copied to the rolling release `update-channels` by channels.yml
      # once a person publishes this draft.
      - name: Update manifests
        run: |
          repo="https://github.com/${{ github.repository }}/releases"
          fetch_previous() {
            code=$(curl -sSL -o "$2" -w '%{http_code}' "$1") || code=000
            case "$code" in
              200) ;;
              404) rm -f "$2" ;;
              *) echo "::error::could not read the previous manifest $1 (HTTP $code)"; exit 1 ;;
            esac
          }
          base="$repo/download/${{ github.ref_name }}"
          if [ "${{ needs.check.outputs.prerelease }}" != "true" ]; then
            fetch_previous "$repo/latest/download/releases.json" previous.json
            prev=()
            if [ -f previous.json ]; then prev=(--previous previous.json); fi
            cargo xtask manifest --channel stable --dist dist --out dist/releases.json "${prev[@]}" --base-url "$base"
            cat dist/releases.json
          fi
          fetch_previous "$repo/download/update-channels/releases-beta.json" previous-beta.json
          prev=()
          if [ -f previous-beta.json ]; then prev=(--previous previous-beta.json); fi
          cargo xtask manifest --channel beta --dist dist --out dist/releases-beta.json "${prev[@]}" --base-url "$base"
          cat dist/releases-beta.json
      - run: cargo xtask checksums dist

      # minisign (Ed25519) signatures over the manifest and the checksums.
      - name: Sign manifest and checksums (minisign)
        if: ${{ needs.check.outputs.sign_minisign == 'true' }}
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in releases.json releases-beta.json SHA256SUMS; do
            [ -f "dist/$f" ] || continue
            printf '%s\n' "$MINISIGN_PASSWORD" |
              minisign -S -s "$RUNNER_TEMP/minisign.key" -m "dist/$f" -x "dist/$f.minisig"
            minisign -V -P "$MINISIGN_PUBLIC_KEY" -m "dist/$f" -x "dist/$f.minisig"
          done
          rm -f "$RUNNER_TEMP/minisign.key"

      - name: Attest build provenance
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Dry-run packages
        if: ${{ github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

      # SignPath Foundation asks for "Code signing policy" on the download
      # page, so every release names and links it, with the privacy policy.
      - name: Draft release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="https://github.com/${{ github.repository }}/blob/main"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Code signing policy

          Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by
          [SignPath Foundation](https://signpath.org/). What is signed, who approves signatures and
          how to check a download: [Code signing policy]($repo/docs/CODE_SIGNING.md).
          Privacy: [Privacy policy]($repo/PRIVACY.md). Installing and uninstalling:
          [Installing FluutCAM]($repo/docs/install.md).

          NOTES
          args=(--draft --verify-tag --title "FluutCAM $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes)
          if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
