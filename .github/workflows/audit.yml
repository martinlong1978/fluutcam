# Daily dependency audit (design D14 §3, spec 06 §6.3). `cargo deny` in ci.yml
# checks advisories on every change; this catches advisories published later.

name: Audit

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit
