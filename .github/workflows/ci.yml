name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Developer Certificate of Origin: every non-merge commit of a pull request
  # needs a Signed-off-by line with its author's email (CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git show -s --format=%ae "$c")
            if ! git show -s --format=%B "$c" | awk -v e="<$email>" '
                tolower($0) ~ /^signed-off-by:/ && index(tolower($0), tolower(e)) { f = 1 }
                END { exit !f }'; then
              echo "::error::$(git show -s --format='%h %s' "$c"): no Signed-off-by line for <$email>"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Add sign-offs with: git rebase --signoff origin/main (see CONTRIBUTING.md)"
          fi
          exit "$bad"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo xtask check-layers
      - uses: EmbarkStudios/cargo-deny-action@v2

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --workspace --locked
