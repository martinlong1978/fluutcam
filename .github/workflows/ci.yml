name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Developer Certificate of Origin: every non-merge commit of a pull request
  # needs a Signed-off-by line with its author's email (CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git show -s --format=%ae "$c")
            if ! git show -s --format=%B "$c" | awk -v e="<$email>" '
                tolower($0) ~ /^signed-off-by:/ && index(tolower($0), tolower(e)) { f = 1 }
                END { exit !f }'; then
              echo "::error::$(git show -s --format='%h %s' "$c"): no Signed-off-by line for <$email>"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "Add sign-offs with: git rebase --signoff origin/main (see CONTRIBUTING.md)"
          fi
          exit "$bad"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo xtask check-layers
      # The generated wiki pages (toolpath types, diagnostics) match the code.
      - run: cargo xtask wiki-reference --check
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The Flathub manifest vendors the crates from cargo-sources.json, made from
  # Cargo.lock. A change to Cargo.lock without regenerating it fails here, not
  # on the Flathub builders (packaging/flatpak/FLATHUB.md).
  flatpak-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/flatpak/update-cargo-sources.sh --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --workspace --locked

  # API docs build (D14 §3). Three rustdoc link warnings are known (see the
  # M8 plan), so warnings do not fail the job yet; errors do.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo doc --workspace --no-deps --locked

  # Reproducible builds (D14 §5.4): build the CLI twice from scratch with the
  # release flags and compare the hashes. Two full release builds are slow, so
  # this runs on main, on tags and on request, not on every pull request.
  repro:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Build twice and compare
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo xtask repro-check
