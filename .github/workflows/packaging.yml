# Packaging dry run (design D14 §5.2): builds the Windows MSI and the Linux
# AppImage from a normal release build, WITHOUT signing or publishing. It runs
# on pull requests that touch the packaging files, and on demand, so a broken
# WiX source, a changed pin or a bad AppDir shows up before a tag does.
# Nothing here uses a secret.

name: Packaging

on:
  pull_request:
    paths:
      - "packaging/**"
      - "xtask/**"
      - ".github/workflows/packaging.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Build
        run: cargo build --release --locked -p fluut-cli -p fluut-app
      - run: cargo xtask icons icons
      - name: Collect binaries
        shell: bash
        run: |
          mkdir bin
          cp target/release/fluut.exe target/release/fluutcam.exe bin/
      - name: Build the MSI (unsigned)
        shell: pwsh
        run: ./packaging/wix/build-msi.ps1 -Version (cargo xtask version) -BinDir bin -IconFile icons/windows/fluutcam.ico -Out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-msi
          path: dist/
          retention-days: 3
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Build
        run: cargo build --release --locked -p fluut-cli -p fluut-app
      - name: Tarball and AppImage (unsigned)
        run: |
          version=$(cargo xtask version)
          mkdir bin
          cp target/release/fluut target/release/fluutcam bin/
          cargo xtask icons icons
          cargo xtask package --platform linux-x86_64 --bin-dir bin --icons icons --out tar
          packaging/appimage/fetch-tools.sh "$RUNNER_TEMP/tools"
          APPIMAGETOOL="$RUNNER_TEMP/tools/appimagetool" RUNTIME="$RUNNER_TEMP/tools/runtime-x86_64" \
            packaging/appimage/build-appimage.sh "tar/fluutcam-$version-linux-x86_64.tar.gz" "$version" work
          "work/fluutcam-$version-linux-x86_64.AppImage" --appimage-extract >/dev/null
          squashfs-root/usr/bin/fluut --version
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-appimage
          path: work/*.AppImage
          retention-days: 3
          if-no-files-found: error

  # The Flatpak is made in two jobs: this one builds the Linux tarball the
  # same way as the AppImage job, and `flatpak` packs the binaries from it in
  # the flatpak-builder container.
  flatpak-input:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Build
        run: cargo build --release --locked -p fluut-cli -p fluut-app
      - id: v
        name: Tarball
        run: |
          version=$(cargo xtask version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir bin
          cp target/release/fluut target/release/fluutcam bin/
          cargo xtask icons icons
          cargo xtask package --platform linux-x86_64 --bin-dir bin --icons icons --out tar
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-input
          path: tar/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  flatpak:
    needs: flatpak-input
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      # flatpak-builder needs bubblewrap, which needs these.
      options: --privileged
    env:
      VERSION: ${{ needs.flatpak-input.outputs.version }}
      APP_ID: io.github.martinlong1978.FluutCAM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-input
          path: in
      - name: Validate the launcher and the metainfo
        run: SUDO= packaging/flatpak/validate.sh
      - name: Stage the inputs
        run: packaging/flatpak/build-flatpak.sh "in/fluutcam-$VERSION-linux-x86_64.tar.gz" "$VERSION" work/flatpak
      - name: Build the bundle (unsigned)
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fluutcam.flatpak
          manifest-path: work/flatpak/io.github.martinlong1978.FluutCAM.yml
          branch: stable
          cache: false
          upload-artifact: false
      - name: Smoke test
        run: packaging/flatpak/smoke-test.sh fluutcam.flatpak "$APP_ID"
      - run: |
          mkdir dist
          mv fluutcam.flatpak "dist/fluutcam-$VERSION-linux-x86_64.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: dry-run-flatpak
          path: dist/*.flatpak
          retention-days: 3
          if-no-files-found: error

  # Dry run of the FLATHUB build (packaging/flatpak/FLATHUB.md): the manifest
  # that builds from source, offline, with the crates of cargo-sources.json,
  # with its `git` source replaced by this checkout. Slow (a full release
  # build in the sandbox), so it runs only here. Nothing is published.
  # cargo-sources.json must match Cargo.lock (the Flathub build is offline).
  # Runs on the plain runner: the Flatpak container has no Python modules or
  # package manager for flatpak-cargo-generator. ci.yml runs the same check.
  cargo-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/flatpak/update-cargo-sources.sh --check

  flathub-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      # flatpak-builder needs bubblewrap, which needs these.
      options: --privileged
    env:
      APP_ID: io.github.martinlong1978.FluutCAM
    steps:
      - uses: actions/checkout@v4
      - name: Validate the launcher and the metainfo
        run: SUDO= packaging/flatpak/validate.sh
      - name: Lint the manifest
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest \
            packaging/flatpak/io.github.martinlong1978.FluutCAM.flathub.yml
      - name: Stage the source build
        run: packaging/flatpak/stage-source-build.sh work/flathub
      - name: Build from source (offline)
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --install-deps-from=flathub --default-branch=stable --repo=repo \
            build work/flathub/io.github.martinlong1978.FluutCAM.yml
      - name: Lint the repository
        run: flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
      - name: Bundle
        run: flatpak build-bundle repo fluutcam.flatpak "$APP_ID" stable
      - name: Smoke test
        run: packaging/flatpak/smoke-test.sh fluutcam.flatpak "$APP_ID"
