[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fluutcam/fluutcam"

[workspace.dependencies]
fluut-geom = { path = "crates/fluut-geom", version = "0.1.0" }
fluut-path = { path = "crates/fluut-path", version = "0.1.0" }
fluut-model = { path = "crates/fluut-model", version = "0.1.0" }
fluut-post = { path = "crates/fluut-post", version = "0.1.0" }
cavalier_contours = "0.9"
glam = "0.34"
libm = "0.2"
smallvec = { version = "1.15", features = ["const_generics", "union"] }
thiserror = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
toml = "1"
sha2 = "0.11"
proptest = "1"
approx = "0.5"
criterion = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
disallowed_methods = "deny"
float_cmp = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
