# What each toolpath setting does, in plain English. Read by
# `cargo xtask wiki-reference` (crates/fluut-model/examples/wiki_reference.rs)
# for the generated type pages. A key is `group.key` (all types) or
# `type.group.key` (one type, which wins). Add the text for a new setting
# here; the generator lists settings that have none.

[help]
# Tool group
"tool_params.spindle_rpm" = "How fast the spindle turns. Left empty, it comes from the tool's cutting data for the Setup's material."
"tool_params.feed.cut" = "How fast the tool moves while it cuts."
"tool_params.feed.plunge" = "How fast the tool moves straight down into the material."
"tool_params.feed.ramp" = "Feed while the tool ramps into the material. Left empty, it is the cut feed."
"tool_params.feed.lead_in" = "Feed on the lead-in move. Left empty, it is the cut feed."
"tool_params.feed.lead_out" = "Feed on the lead-out move. Left empty, it is the lead-in feed."
"tool_params.feed.transition" = "Feed on the short moves that link one pass to the next while the tool stays down. Left empty, it is the cut feed."
"tool_params.coolant" = "Coolant to switch on for this toolpath. The post must have a coolant block, or you get a warning."

# Geometry group
"geometry.drive_faces" = "The faces this toolpath machines. 3-D types machine every face of the Setup's bodies when this is empty; 2-D types need something selected."
"geometry.drive_curves" = "The curves this toolpath follows or fills. 2-D types need curves or faces. The app cannot pick curves yet; set them in the project file."
"geometry.check_faces" = "Faces the tool must not cut into. Left empty, every face that is not a drive face or an excluded face."
"geometry.excluded_faces" = "Faces to leave out: the tool is allowed to cut into them."
"geometry.boundary.curves" = "Closed curves that limit where the toolpath may work."
"geometry.boundary.side" = "Whether the toolpath works inside or outside the boundary."
"geometry.boundary.tool_containment" = "Where the tool stays relative to the boundary: its edge inside, its centre on the line, or its edge outside."
"geometry.rest_from" = "`previous` starts from the material left after the earlier toolpaths in the Setup (rest machining). `off` starts from the full stock."
"geometry.hole_diameter.min" = "Smallest hole diameter to pick up automatically."
"geometry.hole_diameter.max" = "Largest hole diameter to pick up automatically. With both set and nothing selected, the toolpath takes every hole of that size."
"geometry.x_start" = "Where along the rotary axis the toolpath starts."
"geometry.x_end" = "Where along the rotary axis the toolpath ends. It must be beyond the start."

# Heights group (a height is a reference plus an offset)
"heights.clearance" = "The height the tool rises to for the longest moves, above everything including clamps."
"heights.retract" = "The height the tool rises to between cuts. It must not be below the feed height."
"heights.feed" = "The height where the tool changes from rapid to cutting feed on its way down. It is measured from the top height."
"heights.top" = "The top of the material this toolpath cuts. The first cut starts here."
"heights.bottom" = "The bottom of the cut: the lowest point the tool reaches."

# Linking group
"linking.retract" = "How the tool moves between passes: `full` always lifts to the retract height, `minimum` lifts only as far as needed, `stay_down` keeps the tool in the material when the straight move is clear."
"linking.safety_distance" = "How far above the highest point on the way the tool lifts when it retracts the minimum amount."
"linking.transitions" = "Whether the short moves between passes go straight or are smoothed."
"linking.lead_in.kind" = "How the tool eases into the cut: not at all, along a quarter circle, or along a straight line."
"linking.lead_in.radius" = "Radius of an arc lead-in. Left empty, half the tool diameter."
"linking.lead_in.length" = "Length of the straight part of the lead-in."
"linking.lead_out.kind" = "How the tool eases out of the cut. Left empty, the same as the lead-in."
"linking.lead_out.radius" = "Radius of an arc lead-out."
"linking.lead_out.length" = "Length of the straight part of the lead-out."
"linking.ramp.kind" = "How the tool enters the material: straight down (`plunge`), along a zigzag, along a helix, or along the profile. If the chosen ramp does not fit, FluutCAM falls back to a smaller one and warns."
"linking.ramp.angle_deg" = "The angle the tool descends at when it ramps."
"linking.ramp.radius" = "Radius of a helical ramp. Left empty, half the tool diameter."
"linking.order" = "`by_level` finishes each depth level over the whole part before going deeper. `by_area` finishes one area through all levels before the next."

# Passes group: common
"passes.machining_tolerance" = "How far the calculated path may stray from the ideal path. A smaller number gives a smoother path and a longer program."
"passes.max_segment_length" = "Longest straight move in the path. Left empty, there is no limit."
"passes.output_arcs" = "Write arcs as arc moves (G2 and G3) where the path has them. Off writes only straight moves."
"passes.pass_layout" = "`even` spaces the passes equally, so no gap is bigger than asked for. `fixed_from_edge` starts at the edge and leaves what is left over at the end."
"passes.stock_to_leave" = "Material left on the walls for a later finishing pass. A negative value cuts past the model, which is useful for inlays."
"passes.stock_to_leave_axial" = "Material left on floors. Left empty, the same as the wall value."
"passes.step_down" = "How deep each level cuts."
"passes.depth_count" = "Cut this many equal levels instead of using a step-down. Set one or the other."
"passes.stepover" = "How far the tool moves sideways between neighbouring passes."
"passes.direction" = "Which way the tool travels. `climb` has the material on the right of the tool as it moves (with a clockwise spindle), `conventional` the opposite. `zigzag` alternates direction on every pass, and `any`, `selection` and `reversed` follow the curves as selected."
"passes.pass_angle_deg" = "The angle of straight passes, in degrees from the X axis."
"passes.scallop_height" = "Choose the stepover so the ridges between passes are no higher than this. It needs a tool with a rounded tip. Set this or a stepover, not both."
"passes.min_slope_deg" = "Only machine surfaces at least this steep, in degrees from flat."
"passes.max_slope_deg" = "Only machine surfaces at most this steep, in degrees from flat."

# Passes group: contour and chamfer
"passes.side" = "Which side of the curve the tool cuts on: `inside` or `outside` for closed curves, `left` or `right` for open ones, or `on` to put the tool centre on the curve."
"passes.compensation" = "`computer` puts the tool radius into the path. `control` leaves it to the machine's cutter compensation (G41, G42), so the post must support it. `wear` does both, so the operator can adjust for wear."
"passes.finishing_pass_count" = "How many light finishing passes to run after the main cut."
"passes.finishing_stepover" = "Distance between finishing passes. Left empty, a tenth of the tool diameter."
"passes.finish_every_level" = "Run the finishing passes at every level, not only at the last one."
"passes.spring_pass_count" = "How many times to repeat the last pass unchanged, to take out the spring of the tool."
"passes.start_point" = "Where closed curves start. Left empty, the point nearest the end of the previous cut."
"passes.tabs.mode" = "Leave small bridges of material (tabs) so a cut-out part does not move: `off`, a `count` of them, one every `distance`, or at chosen `points`."
"passes.tabs.count" = "Number of tabs, spread evenly along the curve."
"passes.tabs.distance" = "Distance between tabs along the curve."
"passes.tabs.points" = "Positions of the tabs."
"passes.tabs.width" = "Width of each tab. Left empty, the tool diameter."
"passes.tabs.height" = "Height of each tab above the bottom of the cut."
"passes.tabs.ramp_angle_deg" = "The angle the path rises over a tab at."
"passes.chamfer_width" = "The width of the chamfer across its face."
"passes.tip_offset" = "How far the tip of the V tool stays clear of the corner, so it does not touch the wall."

# Passes group: pockets, facing, optimised load
"passes.pattern" = "How the tool covers the area: `offset` follows the outline inward or outward, `raster` runs straight passes, `parallel` and `scallop` are the 3-D patterns."
"passes.offset_order" = "For an offset pattern, whether to start in the middle (`inside_out`) or at the outline (`outside_in`)."
"passes.overlap" = "How far the passes run past the edge of the area, so the tool clears it completely."
"passes.final_step_down" = "A smaller last step, to leave a better floor."
"passes.fine_step_down" = "A smaller step-down used where the surface is nearly flat. Left empty, it is off."
"passes.optimal_load" = "How much of the tool is in the cut sideways at any moment, as a distance. Optimised load keeps this steady so the tool is not overloaded."
"passes.min_cutting_radius" = "Smallest radius the path may turn on. Smaller turns are rounded off."
"passes.flat_detection" = "Find flat areas of the model and cut them at their exact height."
"passes.region_order" = "Whether to machine the steep parts or the shallow parts first."
"passes.threshold_deg" = "The slope that separates steep from shallow, in degrees from flat."
"passes.steep.step_down" = "Step-down used on the steep parts."
"passes.steep.scallop_height" = "Scallop height used on the steep parts."
"passes.steep.direction" = "Cut direction on the steep parts."
"passes.shallow.pattern" = "Pattern used on the shallow parts."
"passes.shallow.stepover" = "Stepover used on the shallow parts."
"passes.shallow.scallop_height" = "Scallop height used on the shallow parts."
"passes.shallow.pass_angle_deg" = "Pass angle used on the shallow parts."
"passes.shallow.direction" = "Cut direction on the shallow parts."

# Passes group: engraving, tracing, bores, drilling
"passes.max_depth" = "The deepest the V tool may go. Left empty, the height of the tool's cone."
"passes.corner_sharpening" = "Add small moves into the corners so they come out sharp."
"passes.depth_mode" = "`heights` cuts at the depth set in Heights. `curve` follows the depth of the curve itself."
"passes.curve_depth" = "With the depth following the curve, how deep to cut below it."
"passes.side_offset" = "Move the path sideways off the curve by this distance."
"passes.feature" = "Whether the circle is a `hole` to cut inside or a `boss` to cut around."
"passes.pitch" = "For a bore, the distance the helix drops per turn. For tapping, the thread pitch."
"passes.finishing_pass" = "Add one light pass at the final size."
"passes.bottom_circle" = "Cut a full circle at the bottom of the hole."
"passes.cycle" = "The drilling cycle: plain `drill`, `spot`, `dwell` at the bottom, `peck` (retract after each peck), `chip_break` (small retract), `tap`, `ream` or `bore`. If the post has no such cycle, FluutCAM writes the moves out instead."
"passes.peck_depth" = "How deep each peck goes before the drill retracts."
"passes.chip_break_retract" = "How far the drill backs off to break the chip."
"passes.dwell_s" = "Seconds to wait at the bottom of the hole, or for a dwell."
"passes.depth_to" = "Whether the depth is measured to the `tip` of the drill or to where the `full_diameter` is reached."
"passes.to_cone_tip" = "For a hole with a cone-shaped bottom, drill to the tip of the cone."
"passes.retract_mode" = "Whether to return to the retract height (`retract`) or the feed height (`feed`) between holes."
"passes.hole_order" = "Drill the holes in the shortest route (`shortest`) or in the order selected."

# Passes group: rotary
"passes.radial_step_down" = "How deep each level cuts, measured in toward the axis."
"passes.stepover_x" = "How far the tool moves along the axis between passes."
"passes.stepover_deg" = "How far around the axis the tool moves between passes, in degrees."
"passes.a_start_deg" = "The rotary angle where the toolpath starts, in degrees."
"passes.a_end_deg" = "The rotary angle where the toolpath ends. Left empty, one full turn from the start."
"passes.advance" = "How far the tool moves along the axis for each turn of the spiral."
"passes.start" = "Whether the spiral starts at the start or the end of the range."
"passes.ring_link" = "How the tool moves to the next ring: in a `step` at the end of the turn, or along a `helical` path."
"passes.rotation" = "Spiral direction seen from above: `ccw` is counter-clockwise, `cw` clockwise."
"passes.machine_corners" = "Run the spiral out into the corners so they are cut too."
"passes.centre" = "The centre of the spiral. Left empty, the centre of the area."
"passes.cut_direction" = "Whether the cut is a climb or a conventional cut."
"passes.continuous" = "Join the rings into one continuous path where possible."

# Passes group: manual NC
"passes.kind" = "What to insert in the program: a `stop`, an `optional_stop`, a `comment`, a `dwell`, or `pass_through` text written as it is."
"passes.text" = "The text for a comment or pass-through. `pass_through` text is written unchecked: you are responsible for it."

# One or two plain sentences per toolpath type, shown at the top of its page.
# Roughing removes the bulk of the material quickly and leaves some behind;
# finishing cuts to the final size.
[description]
contour_2d = "Cuts along a curve, or around the walls of a part, at one or more depths. It can add finishing passes and holding tabs, so it is the usual way to cut out a part. A finishing type."
pocket_2d = "Clears the inside of a closed shape, level by level, down to a flat floor. The tool follows the outline inward, or runs straight passes. A roughing type."
face = "Machines the top of the stock down to one flat height with zigzag passes. A roughing type."
trace = "Moves the tool centre along curves, at the depth of the curve itself or at a depth you set. Use it for grooves and lines. A finishing type."
chamfer_2d = "Cuts a chamfer along an edge with a V-shaped tool. A finishing type."
bore = "Mills a round hole, or the outside of a round boss, with a helical path, so one tool can cut holes of different sizes. A finishing type."
optimised_load_2d = "Clears closed shapes level by level with a path that keeps the tool's sideways load steady: no full-width cuts and smooth turns. This lets you cut deeper and faster. A roughing type."
engrave = "V-carves closed shapes. The V tool runs along the middle of each shape and cuts deeper where the shape is wider. A finishing type."
drill = "Drills holes with the drilling cycles of the machine: drill, spot, dwell, peck, chip-break, tap, ream and bore. Holes come from the round faces of the model, or from circles. If the post has no such cycle, FluutCAM writes the moves out instead."
parallel = "Straight parallel passes across the model that follow its surface up and down. The usual 3-D finishing toolpath for shapes and relief. A finishing type."
contour = "Level-by-level (waterline) passes around the model at constant height. Works best on steep walls. A finishing type."
horizontal = "Finishes only the flat faces of the model, at their exact height. A finishing type."
spiral = "A spiral outward or inward from a centre point that follows the surface up and down. A finishing type."
scallop = "Passes that follow the outline of the region inward over the surface, with an even distance between them measured along the surface. A finishing type."
steep_and_shallow = "Splits the model by slope: level-by-level passes on the steep parts and parallel or scallop passes on the shallow parts. A finishing type."
optimised_load_3d = "Clears the stock above a 3-D model level by level with the optimised-load path of the 2-D type. A roughing type."
pocket_3d = "Clears the stock above a 3-D model level by level, with offset or straight passes. A roughing type."
rotary_rough = "Clears a part on a rotary axis in layers at constant radius. A roughing type for rotary Setups."
rotary_along_x = "Passes along the rotary axis, with the part turned a little between passes. A finishing type for rotary Setups."
rotary_around_a = "Full turns of the part at one position along the axis, then a step along the axis. A finishing type for rotary Setups."
rotary_spiral = "One continuous spiral: the part turns while the tool advances along the axis, with no lifts. A finishing type for rotary Setups."
manual_nc = "Inserts one line or block into the program at its place in the Setup: a stop, an optional stop, a comment, a dwell, or text of your own. It cuts nothing."
