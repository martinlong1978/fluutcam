# cargo-deny configuration (design D14 §1, spec 06 §6.1): no copyleft dependencies.
[graph]
all-features = true

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # egui (S4): clipboard-win on Windows, and bundled OFL UI fonts.
    "BSL-1.0",
    "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
# Unmaintained (not vulnerable) crates under the UI toolkit (M5). Revisit when
# eframe moves to zbus 6 and egui_dock drops `paste`.
ignore = [
    # paste: proc macro used by egui_dock.
    { id = "RUSTSEC-2024-0436", reason = "build-time macro of egui_dock; no maintained replacement upstream yet" },
    # zbus_names, zvariant, zvariant_derive: merged into zbus 6; reached through
    # accesskit_unix (AT-SPI accessibility on Linux) in eframe 0.36.
    { id = "RUSTSEC-2026-0371", reason = "zbus 5 crate under accesskit_unix; merged into zbus 6" },
    { id = "RUSTSEC-2026-0370", reason = "zbus 5 crate under accesskit_unix; merged into zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zbus 5 crate under accesskit_unix; merged into zbus 6" },
]
