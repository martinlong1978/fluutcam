# cargo-deny configuration (design D14 §1, spec 06 §6.1): no copyleft dependencies.
[graph]
all-features = true

[licenses]
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # egui (S4): clipboard-win on Windows, and bundled OFL UI fonts.
    "BSL-1.0",
    "OFL-1.1",
    # rhai (M7): smartstring is MPL-2.0 (file-level copyleft, allowed by
    # spec 06 §6.1); tiny-keccak, a build-time dependency of its hash seed,
    # is CC0-1.0 (public domain).
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
ignore = [
    # smartstring is unmaintained (not a vulnerability). rhai 1.27, the
    # latest, still requires it; revisit when rhai moves to compact_str.
    { id = "RUSTSEC-2026-0249", reason = "unmaintained only; required by rhai (M7 scripting)" },
]
